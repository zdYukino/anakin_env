schema_version: 2
# Only deliberate input competes; neutral device heartbeats keep the current owner.
# Conflicts within one cycle: Unitree remote > SDL Joy > web.
primary: auto
enabled_sources: [web, gamepad, remote]
web:
  actions: [disarmed, damping, align, hold, asap_loco, asap_cr7, clear_fault, emergency_stop, motion_toggle, height_up, height_down]
gamepad:
  device_index: 0
  # Xbox Series X Bluetooth firmware 5.9: older SDL's generic Xbox mapping is incorrect.
  # Exact GUID only; USB and other controllers retain their own SDL mappings.
  mappings:
    - "050000005e040000130b000009050000,Xbox Series X Controller,a:b0,b:b1,x:b3,y:b4,back:b10,start:b11,guide:b12,leftshoulder:b6,rightshoulder:b7,leftstick:b13,rightstick:b14,dpup:h0.1,dpright:h0.2,dpdown:h0.4,dpleft:h0.8,leftx:a0,lefty:a1,rightx:a2,righty:a3,lefttrigger:a5,righttrigger:a4,platform:Linux,"
remote: {channel: lowstate}
motion:
  deadzone: 0.04
  velocity_axes:
    forward: {axis: left_y, scale: 0.5}
    lateral: {axis: left_x, scale: -0.5}
    yaw: {axis: right_x, scale: -1.0}
  initial_height: 0.78
  height_step: 0.05
# This one logical controller map is shared by SDL gamepads and Unitree remotes.
controller_bindings:
  - {button: Down, shoulders: [L1, R1], trigger: pressed, action: disarmed}
  - {button: A, shoulders: any, trigger: held, action: emergency_stop}
  - {button: B, shoulders: any, trigger: held, action: emergency_stop}
  - {button: X, shoulders: [L1, R1], trigger: pressed, action: align}
  - {button: Up, shoulders: [L1, R1], trigger: pressed, action: hold}
  - {button: Down, shoulders: [R1], trigger: pressed, action: asap_loco}
  - {button: Up, shoulders: [R1], trigger: pressed, action: asap_cr7}
  - {button: Y, shoulders: [L1, R1], trigger: pressed, action: clear_fault}
  - {button: Left, shoulders: [], trigger: pressed, action: motion_toggle}
  - {button: Up, shoulders: [], trigger: pressed, action: height_up}
  - {button: Down, shoulders: [], trigger: pressed, action: height_down}
